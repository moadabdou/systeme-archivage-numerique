<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidi Boutmim - Employee Archives</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Système d’Archivage Numérique des Employés</h1>
        <h2>Commune de Sidi Boutmim</h2>
    </header>

    <main>
        <section id="add-employee-section">
            <h3>Ajouter un Nouvel Employé</h3>
            <form id="add-employee-form">
                <div class="form-group">
                    <label for="name">Nom Complet</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="cin">CIN</label>
                    <input type="text" id="cin" name="cin" required>
                </div>
                <div class="form-group">
                    <label for="post">Poste</label>
                    <input type="text" id="post" name="post" required>
                </div>
                <div class="form-group">
                    <label for="status">Statut</label>
                    <select id="status" name="status" required>
                        <option value="Active">Actif</option>
                        <option value="Retired">Retraité</option>
                        <option value="Contractual">Contractuel</option>
                    </select>
                </div>
                <button type="submit">Ajouter l'Employé</button>
            </form>
        </section>

        <section id="employee-list-section">
            <h3>Liste des Employés</h3>
            <div id="employee-list-container">
                <!-- Employee data will be loaded here by JavaScript -->
                <p>Loading...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
